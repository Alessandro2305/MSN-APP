<!DOCTYPE html>
<html lang="pt-br">

<head>
<link rel="manifest" href="./manifest.json">

<meta name="theme-color" content="#53cb03">

<meta name="mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<meta name="apple-mobile-web-app-title" content="MSN Live">

<link rel="icon"
      type="image/png"
      sizes="192x192"
      href="./imagem/icon-192.png">

<link rel="apple-touch-icon"
      sizes="192x192"
      href="./imagem/icon-192.png">
</head>

<body>
    <div class="container">
        <!-- Fundo Estelar / Efeitos Nebula -->
        <div id="stars"></div>
        <div id="stars2"></div>
        <div id="stars3"></div>

        <div class="app-wrapper">
            <form method="post" id="loginForm">

                <button type="button" class="Btn-sair" id="btnSair" aria-label="Sair">
                    <div class="sign">
                        <svg viewBox="0 0 512 512" width="16" height="16">
                            <path fill="currentColor"
                                d="M377.9 105.9L500.7 228.7c7.2 7.2 11.3 17.1 11.3 27.3s-4.1 20.1-11.3 27.3L377.9 406.1c-6.4 6.4-15 9.9-24 9.9c-18.7 0-33.9-15.2-33.9-33.9l0-62.1-128 0c-17.7 0-32-14.3-32-32l0-64c0-17.7 14.3-32 32-32l128 0 0-62.1c0-18.7 15.2-33.9 33.9-33.9c9 0 17.6 3.6 24 9.9zM160 96L96 96c-17.7 0-32 14.3-32 32l0 256c0 17.7 14.3 32 32 32l64 0c17.7 0 32 14.3 32 32s-14.3 32-32 32l-64 0c-53 0-96-43-96-96L0 128C0 75 43 32 96 32l64 0c17.7 0 32 14.3 32 32s-14.3 32-32 32z">
                            </path>
                        </svg>
                    </div>
                    <div class="text">SAIR</div>
                </button>

                <div class="header">
                    <img src="img/logo.png" alt="Windows Live Logo">
                </div>

                <div class="caixa">
                    <div class="avatar-wrapper">
                        <div class="status-ring online" id="statusRing"></div>
                        <div class="avatar-circle">
                            <img src="img/icone.png" alt="Foto de Perfil" id="userPhoto">
                        </div>
                    </div>

                    <div class="input-wrapper">
                        <div class="nebula-input">
                            <i class="fa-solid fa-envelope icon-neon"></i>
                            <input required id="email" type="email" name="email" class="input" placeholder=" " autocomplete="email" />
                            <label for="email" class="user-label">E-mail</label>
                            <div class="nebula-particle" style="--x:0.2; --y:-0.4; --delay:0.1s"></div>
                            <div class="nebula-particle" style="--x:0.5; --y:-0.2; --delay:0.3s"></div>
                            <div class="nebula-particle" style="--x:0.3; --y:0.3; --delay:0.5s"></div>
                            <div class="nebula-particle" style="--x:0.7; --y:0.1; --delay:0.2s"></div>
                            <div class="nebula-particle" style="--x:0.1; --y:-0.7; --delay:0.4s"></div>
                            <div class="nebula-particle" style="--x:0.6; --y:0.4; --delay:0.6s"></div>
                        </div>

                        <div class="nebula-input">
                            <i class="fa-solid fa-lock icon-neon"></i>
                            <input required id="password" type="password" name="password" class="input" placeholder=" " autocomplete="current-password" />
                            <label for="password" class="user-label">Digite sua senha</label>
                            <div class="nebula-particle" style="--x:0.2; --y:-0.4; --delay:0.1s"></div>
                            <div class="nebula-particle" style="--x:0.5; --y:-0.2; --delay:0.3s"></div>
                            <div class="nebula-particle" style="--x:0.3; --y:0.3; --delay:0.5s"></div>
                            <div class="nebula-particle" style="--x:0.7; --y:0.1; --delay:0.2s"></div>
                            <div class="nebula-particle" style="--x:0.1; --y:-0.7; --delay:0.4s"></div>
                            <div class="nebula-particle" style="--x:0.6; --y:0.4; --delay:0.6s"></div>
                        </div>
                    </div>

                    <div class="status-container">
                        <span class="status-label">Entrar como:</span>

                        <!-- Botão de Status Customizado -->
                        <div class="custom-dropdown" id="dropdownBtn" role="button" aria-haspopup="true" aria-expanded="false" tabindex="0">
                            <span class="status-dot online" id="selectedDot"></span>
                            <span id="selectedText">Disponível</span>
                            <span class="arrow">▼</span>
                        </div>

                        <!-- Menu de Seleção de Status -->
                        <div class="dropdown-menu" id="dropdownMenu">
                            <div class="dropdown-item" data-value="online" data-color="#53cb03" data-text="Disponível">
                                <span class="status-dot online"></span>
                                <span>Disponível</span>
                            </div>
                            <div class="dropdown-item" data-value="busy" data-color="#ff3131" data-text="Ocupado">
                                <span class="status-dot busy"></span>
                                <span>Ocupado</span>
                            </div>
                            <div class="dropdown-item" data-value="away" data-color="#ffac33" data-text="Ausente">
                                <span class="status-dot away"></span>
                                <span>Ausente</span>
                            </div>
                            <div class="dropdown-item" data-value="invisible" data-color="#888888" data-text="Invisível">
                                <span class="status-dot invisible"></span>
                                <span>Invisível</span>
                            </div>
                        </div>
                    </div>

                    <div class="options-container">
                        <label>
                            <input type="checkbox" name="lembrar"> Lembrar minha ID e senha
                        </label>
                        <label>
                            <input type="checkbox" name="auto"> Entrar automaticamente
                        </label>
                    </div>

                    <div class="recuperar-senha">
                        <a href="#">Esqueceu sua senha?</a>
                    </div>

                    <div class="btn">
                        <button type="submit" class="submit">ENTRAR</button>
                        <button type="button" class="submit-cadastrar" id="btnCadastro">CRIAR CONTA</button>
                    </div>
                </div>
            </form>

            <p class="developer-credit">Desenvolvedor Alessandro-Mançano</p>
        </div>

        <!-- Overlay de Carregamento estilo MSN -->
        <div class="loading-overlay" id="loadingOverlay">
            <div class="msn-loader">
                <div class="pawn pawn-blue"></div>
                <div class="pawn pawn-green"></div>
            </div>
            <span style="font-weight: bold; letter-spacing: 1px;">Carregando...</span>
        </div>

    </div>
</body>

</html>
